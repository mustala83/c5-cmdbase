queue_rules:
  - name: default
    merge_conditions: []

pull_request_rules:
  - name: c5 base config marker
    conditions:
      - "label=c5-never"
    actions:
      comment:
        message: "C5-BASE-CONFIG-EXECUTED"

commands_restrictions:
  copy:
    conditions:
      - "title ~= ^\\[copy-ok\\]"
  backport:
    conditions:
      - "label = c5-approved"
  queue:
    conditions:
      - base = main
