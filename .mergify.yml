queue_rules:
  - name: default
    merge_conditions: []

pull_request_rules:
  - name: c5 base config marker
    conditions:
      - "label=c5-never"
    actions:
      comment:
        message: "C5-BASE-CONFIG-EXECUTED"

# Verbatim shape of the snippet under "If you want the author of a same-repository
# pull request to be able to run these commands too" in
# https://docs.mergify.com/commands/restrictions  -- note the missing `from-fork`.
commands_restrictions:
  squash:
    conditions:
      - or:
          - sender-permission >= write
          - sender = {{author}}
  rebase:
    conditions:
      - or:
          - sender-permission >= write
          - sender = {{author}}
  update:
    conditions:
      - or:
          - sender-permission >= write
          - sender = {{author}}
